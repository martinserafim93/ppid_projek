services:
  app:
    build: ./php
    container_name: php85-fpm
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - lemp-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lemp-network

  db:
    image: mariadb:10.11
    container_name: mariadb-10-11
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ppid_kaltara
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ppid_user
      MYSQL_PASSWORD: ppid_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - lemp-network

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - lemp-network

volumes:
  mariadb_data:

networks:
  lemp-network:
    driver: bridge
